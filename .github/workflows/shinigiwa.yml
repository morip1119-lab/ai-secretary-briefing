name: 死に際チャンネル 自動投稿

on:
  schedule:
    # 30分おきに起動し、投稿時刻を過ぎた原稿だけを出す（cron は UTC）
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '実際には投稿しない'
        type: boolean
        default: true
      command:
        description: '実行するコマンド'
        type: choice
        default: auto
        options: [auto, generate, queue, publish, doctor]

concurrency:
  group: shinigiwa-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shinigiwa
    env:
      # リポジトリ変数 SHINIGIWA_LIVE を "true" にするまで本番投稿しない
      DRY_RUN: ${{ inputs.dry_run == false && vars.SHINIGIWA_LIVE == 'true' && 'false' || 'true' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'mock' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shinigiwa/package-lock.json

      - run: npm ci

      - name: フォントを取得（キャッシュ）
        uses: actions/cache@v4
        with:
          path: shinigiwa/assets/fonts
          key: shinigiwa-fonts-v1

      - run: npm run setup:fonts

      - name: 実行
        run: node src/cli.js ${{ inputs.command || 'auto' }}

      - name: 投稿状態をコミット
        if: env.DRY_RUN == 'false'
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$(git status --porcelain shinigiwa/data)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  'shinigiwa-bot'
          git config user.email 'shinigiwa-bot@users.noreply.github.com'
          git add shinigiwa/data
          git commit -m "chore(shinigiwa): 投稿状態を更新 [skip ci]"
          git push
